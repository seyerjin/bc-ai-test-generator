name: Build Extension VSIX

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./al-ai-test-generator  

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Package Extension
        run: vsce package
        

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bc-ai-test-generator-vsix
          path: al-ai-test-generator/*.vsix
          if-no-files-found: error