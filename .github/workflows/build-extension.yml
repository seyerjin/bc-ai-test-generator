name: Build and Release Extension

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release Type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - prerelease
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write
  pull-requests: write

env:
  NODE_VERSION: '20'
  EXTENSION_DIR: './al-ai-test-generator'

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    name: Code Quality Analysis
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.EXTENSION_DIR }}/package-lock.json

      - name: Install Dependencies
        working-directory: ${{ env.EXTENSION_DIR }}
        run: npm ci

      - name: Run ESLint
        working-directory: ${{ env.EXTENSION_DIR }}
        run: npm run lint
        continue-on-error: false

      - name: TypeScript Type Check
        working-directory: ${{ env.EXTENSION_DIR }}
        run: npx tsc --noEmit
        continue-on-error: false

      - name: Security Audit
        working-directory: ${{ env.EXTENSION_DIR }}
        run: npm audit --audit-level=moderate
        continue-on-error: true

  build:
    needs: [quality-checks]
    runs-on: ubuntu-latest
    name: Build Extension
    outputs:
      version: ${{ steps.version.outputs.version }}
      vsix-name: ${{ steps.package.outputs.vsix-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.EXTENSION_DIR }}/package-lock.json

      - name: Install Dependencies
        working-directory: ${{ env.EXTENSION_DIR }}
        run: npm ci

      - name: Determine Version
        id: version
        working-directory: ${{ env.EXTENSION_DIR }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            npm version ${{ github.event.inputs.release_type }} --no-git-tag-version
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            npm version $VERSION --no-git-tag-version --allow-same-version
          fi
          
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Building version: $VERSION"

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Package Extension
        id: package
        working-directory: ${{ env.EXTENSION_DIR }}
        run: |
          VSIX_NAME="bc-ai-test-generator-${{ steps.version.outputs.version }}.vsix"
          vsce package --out $VSIX_NAME
          echo "vsix-name=$VSIX_NAME" >> $GITHUB_OUTPUT
          echo "✅ Created: $VSIX_NAME"

      - name: Upload VSIX Artifact (Pull Requests)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bc-ai-test-generator-vsix-pr-${{ github.event.pull_request.number }}
          path: ${{ env.EXTENSION_DIR }}/*.vsix
          if-no-files-found: error
          retention-days: 14

      - name: Comment on PR with Download Link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## 📦 Extension Build Successful\n\n` +
              `**Version:** ${{ steps.version.outputs.version }}\n` +
              `**Artifact:** \`${{ steps.package.outputs.vsix-name }}\`\n\n` +
              `### How to test:\n` +
              `1. Download the artifact from this workflow run\n` +
              `2. Install: \`code --install-extension ${{ steps.package.outputs.vsix-name }}\`\n` +
              `3. Test the extension in VS Code\n\n` +
              `[📥 Download Artifact](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Store VSIX for Release Job
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: vsix-for-release
          path: ${{ env.EXTENSION_DIR }}/*.vsix
          retention-days: 1

  release:
    needs: [build]
    runs-on: ubuntu-latest
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: vsix-for-release
          path: ./release-artifacts/

      - name: Generate Changelog
        id: changelog
        run: |
          if [ -f "CHANGELOG.md" ]; then
            CHANGELOG=$(sed -n '/^## \[${{ needs.build.outputs.version }}\]/,/^## \[/p' CHANGELOG.md | sed '$d')
          else
            CHANGELOG="Version ${{ needs.build.outputs.version }}"
          fi
          
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Release v${{ needs.build.outputs.version }}
          body: |
            ## BC AI Test Generator v${{ needs.build.outputs.version }}
            
            ${{ steps.changelog.outputs.changelog }}
            
            ### Installation
            ```bash
            code --install-extension bc-ai-test-generator-${{ needs.build.outputs.version }}.vsix
            ```
            
            ### What's Changed
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          files: ./release-artifacts/*.vsix
          draft: false
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
