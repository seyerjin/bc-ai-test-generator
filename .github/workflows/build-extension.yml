name: Build Extension VSIX

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./al-ai-test-generator  # WICHTIG: Zeigt auf deinen Unterordner

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm ci

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Package Extension
        run: vsce package
        # Das erstellt die .vsix Datei in al-ai-test-generator/

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v3
        with:
          name: bc-ai-test-generator-vsix
          path: al-ai-test-generator/*.vsix