name: Build and Release Extension

on:
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - 'al-ai-test-generator/**'
  push:
    branches: [ "main", "dev" ]
    tags:
      - 'v*.*.*'
    paths:
      - 'al-ai-test-generator/**'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release Type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - prerelease

permissions:
  contents: write
  packages: write
  pull-requests: write

env:
  NODE_VERSION: '20'
  EXTENSION_DIR: './al-ai-test-generator'

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    name: Code Quality Analysis
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.EXTENSION_DIR }}/package-lock.json

      - name: Install Dependencies
        working-directory: ${{ env.EXTENSION_DIR }}
        run: npm ci

      - name: Run ESLint
        working-directory: ${{ env.EXTENSION_DIR }}
        run: npm run lint
        continue-on-error: false

      - name: TypeScript Type Check
        working-directory: ${{ env.EXTENSION_DIR }}
        run: npx tsc --noEmit
        continue-on-error: false

      - name: Security Audit
        working-directory: ${{ env.EXTENSION_DIR }}
        run: npm audit --audit-level=moderate
        continue-on-error: true

  build:
    needs: [quality-checks]
    runs-on: ubuntu-latest
    name: Build Extension
    if: >
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/'))) || 
      github.event_name == 'workflow_dispatch'
    outputs:
      version: ${{ steps.version.outputs.version }}
      vsix-name: ${{ steps.package.outputs.vsix-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.EXTENSION_DIR }}/package-lock.json

      - name: Install Dependencies
        working-directory: ${{ env.EXTENSION_DIR }}
        run: npm ci

      - name: Auto-Bump Version (Main -> Minor)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ${{ env.EXTENSION_DIR }}
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          npm version minor --no-git-tag-version
          git add package.json package-lock.json
          git commit -m "chore: auto-bump version to $(node -p "require('./package.json').version") [skip ci]"
          git push

      - name: Auto-Bump Version (Dev -> Prerelease)
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        working-directory: ${{ env.EXTENSION_DIR }}
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          # preid=dev sorgt für das "-dev" im Namen
          npm version prerelease --preid=dev --no-git-tag-version
          git add package.json package-lock.json
          git commit -m "chore: auto-bump dev version to $(node -p "require('./package.json').version") [skip ci]"
          git push

      - name: Determine Version
        id: version
        working-directory: ${{ env.EXTENSION_DIR }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            npm version ${{ github.event.inputs.release_type }} --no-git-tag-version
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            npm version $VERSION --no-git-tag-version --allow-same-version
          fi
          
          # Liest die (oben geänderte) Version aus
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Building version: $VERSION"

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Package Extension
        id: package
        working-directory: ${{ env.EXTENSION_DIR }}
        run: |
          VSIX_NAME="bc-ai-test-generator-${{ steps.version.outputs.version }}.vsix"
          vsce package --out $VSIX_NAME
          echo "vsix-name=$VSIX_NAME" >> $GITHUB_OUTPUT
          echo "✅ Created: $VSIX_NAME"

      - name: Store VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bc-ai-test-generator-${{ steps.version.outputs.version }}
          path: ${{ env.EXTENSION_DIR }}/*.vsix
          retention-days: 5

  release:
    needs: [build]
    runs-on: ubuntu-latest
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: bc-ai-test-generator-${{ needs.build.outputs.version }}
          path: ./release-artifacts/

      - name: Generate Changelog
        id: changelog
        run: |
          if [ -f "CHANGELOG.md" ]; then
            CHANGELOG=$(sed -n '/^## \[${{ needs.build.outputs.version }}\]/,/^## \[/p' CHANGELOG.md | sed '$d')
          else
            CHANGELOG="Version ${{ needs.build.outputs.version }}"
          fi
          
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Release v${{ needs.build.outputs.version }}
          body: |
            ## BC AI Test Generator v${{ needs.build.outputs.version }}
            
            ${{ steps.changelog.outputs.changelog }}
            
            ### Installation
            ```bash
            code --install-extension bc-ai-test-generator-${{ needs.build.outputs.version }}.vsix
            ```
          files: ./release-artifacts/*.vsix
          draft: false
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}