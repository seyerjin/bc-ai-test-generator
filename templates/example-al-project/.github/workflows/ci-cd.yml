# ============================================================================
# CI/CD Pipeline for Business Central AL Projects
# ============================================================================
# 
# This pipeline template provides automated testing, code coverage analysis,
# and mutation testing for Business Central AL projects using the 
# BC AI Test Generator extension.
#
# SETUP INSTRUCTIONS:
# 1. Copy this file to your AL project: .github/workflows/ci-cd.yml
# 2. Copy mutation testing files to: .github/mutation-testing/
# 3. Configure GitHub Secrets (see REQUIRED SECRETS section below)
# 4. Customize the configuration section for your project
#
# For detailed setup guide, see: templates/README.md
# ============================================================================

name: CI/CD Pipeline

# ============================================================================
# TRIGGER CONFIGURATION
# ============================================================================
# This pipeline runs on:
# - Push to main or develop branches (excluding documentation changes)
# - Pull requests to main branch
# - Manual workflow dispatch
# ============================================================================
on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'          # Ignore markdown files
      - 'docs/**'        # Ignore documentation
      - '.vscode/**'     # Ignore VS Code settings
      - '.gitignore'
  pull_request:
    branches: [ main ]
  workflow_dispatch:      # Allow manual trigger

# ============================================================================
# PERMISSIONS
# ============================================================================
# Minimum required permissions following principle of least privilege
# ============================================================================
permissions:
  contents: read           # Read repository contents
  actions: read           # Read workflow artifacts
  pull-requests: write    # Comment on PRs with test results

# ============================================================================
# ENVIRONMENT VARIABLES
# ============================================================================
# Global variables used across all jobs
# ============================================================================
env:
  AL_GO_VERSION: 'v4.0'   # Microsoft AL-Go framework version

# ============================================================================
# CONFIGURATION
# ============================================================================
# Customize these values for your project
# ============================================================================
#
# PROJECT_NAME: Your AL project name (e.g., "MyExtension")
# BUILD_MODE: Default | Clean | Translated
# MIN_COVERAGE: Minimum required code coverage percentage (recommended: 70)
# MIN_MUTATION_SCORE: Minimum required mutation score (recommended: 60)
#
# ============================================================================

jobs:
  # ==========================================================================
  # JOB: Initialization
  # ==========================================================================
  # Initializes the workflow and sets up telemetry
  # ==========================================================================
  Initialization:
    runs-on: [ windows-latest ]
    outputs:
      telemetryScopeJson: ${{ steps.init.outputs.telemetryScopeJson }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize AL-Go Workflow
        id: init
        uses: microsoft/AL-Go-Actions/WorkflowInitialize@v4.0
        with:
          shell: powershell

  # ==========================================================================
  # JOB: Build
  # ==========================================================================
  # Compiles AL code and creates deployment artifacts
  # 
  # Outputs:
  #   - Apps artifacts (.app files)
  #   - Test Apps artifacts (.app files)
  # ==========================================================================
  Build:
    needs: [ Initialization ]
    runs-on: [ windows-latest ]
    name: Build AL Application
    outputs:
      AppsArtifactsName: ${{ steps.calculateArtifactNames.outputs.AppsArtifactsName }}
      TestAppsArtifactsName: ${{ steps.calculateArtifactNames.outputs.TestAppsArtifactsName }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read AL-Go Settings
        id: ReadSettings
        uses: microsoft/AL-Go-Actions/ReadSettings@v4.0
        with:
          shell: powershell

      # ======================================================================
      # REQUIRED SECRETS:
      # ======================================================================
      # licenseFileUrl: URL to your Business Central license file
      # insiderSasToken: SAS token for insider builds (optional)
      # KeyVaultCertificatePfxPassword: Password for code signing (optional)
      # KeyVaultCertificatePassword: Certificate password (optional)
      # KeyVaultClientId: Azure Key Vault client ID (optional)
      # ======================================================================
      - name: Read Secrets
        uses: microsoft/AL-Go-Actions/ReadSecrets@v4.0
        with:
          shell: powershell
          settingsJson: ${{ env.Settings }}
          secrets: 'licenseFileUrl,insiderSasToken,KeyVaultCertificatePfxPassword,KeyVaultCertificatePassword,KeyVaultClientId'

      - name: Calculate Artifact Names
        id: calculateArtifactNames
        run: |
          # Customize project name and build mode here
          $project = "main"
          $buildMode = "Default"
          
          # Modern GitHub Actions output syntax
          echo "AppsArtifactsName=$project-Apps-$buildMode" >> $env:GITHUB_OUTPUT
          echo "TestAppsArtifactsName=$project-TestApps-$buildMode" >> $env:GITHUB_OUTPUT
        shell: powershell

      - name: Build AL Project
        uses: microsoft/AL-Go-Actions/RunPipeline@v4.0
        with:
          shell: powershell
          settingsJson: ${{ env.Settings }}
          secretsJson: ${{ env.RepoSecrets }}

      - name: Publish App Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.calculateArtifactNames.outputs.AppsArtifactsName }}
          path: .buildartifacts/Apps/*.app
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish Test App Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.calculateArtifactNames.outputs.TestAppsArtifactsName }}
          path: .buildartifacts/TestApps/*.app
          if-no-files-found: ignore
          retention-days: 30

  # ==========================================================================
  # JOB: Test
  # ==========================================================================
  # Executes AL tests in a Business Central container
  # 
  # Outputs:
  #   - Test results (XML format)
  #   - Test execution logs
  # ==========================================================================
  Test:
    needs: [ Initialization, Build ]
    runs-on: [ windows-latest ]
    name: Run AL Tests
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read AL-Go Settings
        uses: microsoft/AL-Go-Actions/ReadSettings@v4.0
        with:
          shell: powershell

      - name: Read Secrets
        uses: microsoft/AL-Go-Actions/ReadSecrets@v4.0
        with:
          shell: powershell
          settingsJson: ${{ env.Settings }}
          secrets: 'licenseFileUrl,insiderSasToken'

      - name: Download App Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.Build.outputs.AppsArtifactsName }}
          path: .artifacts/apps

      - name: Download Test App Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.Build.outputs.TestAppsArtifactsName }}
          path: .artifacts/testapps

      - name: Execute Tests in BC Container
        uses: microsoft/AL-Go-Actions/RunTests@v4.0
        with:
          shell: powershell
          settingsJson: ${{ env.Settings }}
          secretsJson: ${{ env.RepoSecrets }}

      - name: Publish Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TestResults
          path: .buildartifacts/TestResults/*.xml
          if-no-files-found: ignore
          retention-days: 30

  # ==========================================================================
  # JOB: Code Coverage
  # ==========================================================================
  # Analyzes code coverage from test results
  # 
  # Outputs:
  #   - Coverage report (JSON + HTML)
  #   - PR comment with coverage metrics
  # 
  # Configuration:
  #   - MIN_COVERAGE: Set minimum coverage threshold (default: 70%)
  # ==========================================================================
  CodeCoverage:
    needs: [ Initialization, Build, Test ]
    runs-on: [ windows-latest ]
    name: Analyze Code Coverage
    if: always() && needs.Test.result != 'cancelled'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Test Results
        uses: actions/download-artifact@v4
        with:
          name: TestResults
          path: .buildartifacts/TestResults

      - name: Install BcContainerHelper Module
        run: |
          Install-Module -Name BcContainerHelper -Force -AllowClobber
        shell: powershell

      - name: Calculate Code Coverage
        id: coverage
        continue-on-error: true
        run: |
          # ================================================================
          # Code Coverage Analysis
          # ================================================================
          # Parses test results and calculates coverage metrics
          # 
          # Metrics:
          #   - Line Coverage: Percentage of code lines executed
          #   - Branch Coverage: Percentage of decision branches taken
          # 
          # Thresholds (customize as needed):
          #   - Warning: < 70%
          #   - Error: < 50%
          # ================================================================
          
          $testFiles = Get-ChildItem -Path ".buildartifacts/TestResults" -Filter "*.xml" -Recurse
          $totalLines = 0
          $coveredLines = 0
          $totalBranches = 0
          $coveredBranches = 0
          
          foreach ($testFile in $testFiles) {
            [xml]$testXml = Get-Content $testFile.FullName
            
            if ($testXml.testsuites) {
              foreach ($testsuite in $testXml.testsuites.testsuite) {
                if ($testsuite.properties.property) {
                  foreach ($property in $testsuite.properties.property) {
                    if ($property.name -eq "LineCoverage") {
                      $coverage = $property.value -split "/"
                      $coveredLines += [int]$coverage[0]
                      $totalLines += [int]$coverage[1]
                    }
                    if ($property.name -eq "BranchCoverage") {
                      $coverage = $property.value -split "/"
                      $coveredBranches += [int]$coverage[0]
                      $totalBranches += [int]$coverage[1]
                    }
                  }
                }
              }
            }
          }
          
          $lineCoveragePercent = if ($totalLines -gt 0) { ($coveredLines / $totalLines) * 100 } else { 0 }
          $branchCoveragePercent = if ($totalBranches -gt 0) { ($coveredBranches / $totalBranches) * 100 } else { 0 }
          
          Write-Host "Line Coverage: $($lineCoveragePercent.ToString('F2'))%"
          Write-Host "Branch Coverage: $($branchCoveragePercent.ToString('F2'))%"
          
          # Export metrics
          echo "lineCoverage=$($lineCoveragePercent.ToString('F2'))" >> $env:GITHUB_OUTPUT
          echo "branchCoverage=$($branchCoveragePercent.ToString('F2'))" >> $env:GITHUB_OUTPUT
          echo "coveredLines=$coveredLines" >> $env:GITHUB_OUTPUT
          echo "totalLines=$totalLines" >> $env:GITHUB_OUTPUT
          
          # Create JSON summary for further analysis
          New-Item -Path ".buildartifacts/coverage" -ItemType Directory -Force | Out-Null
          $summary = @{
            lineCoverage = $lineCoveragePercent
            branchCoverage = $branchCoveragePercent
            lines = @{ covered = $coveredLines; total = $totalLines }
            branches = @{ covered = $coveredBranches; total = $totalBranches }
            timestamp = Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ"
          }
          $summary | ConvertTo-Json | Out-File -FilePath ".buildartifacts/coverage/summary.json"
          
          # Threshold validation (customize as needed)
          $minCoverage = 70  # Minimum recommended coverage
          
          if ($lineCoveragePercent -lt $minCoverage) {
            Write-Warning "Line coverage ($($lineCoveragePercent.ToString('F2'))%) is below recommended threshold ($minCoverage%)"
          }
        shell: powershell

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CoverageReport
          path: .buildartifacts/coverage/
          if-no-files-found: ignore
          retention-days: 90

      - name: Comment PR with Coverage Report
        if: github.event_name == 'pull_request' && steps.coverage.outcome == 'success'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const coverageFile = '.buildartifacts/coverage/summary.json';
            
            if (!fs.existsSync(coverageFile)) {
              core.info('Coverage summary not found');
              return;
            }
            
            const coverage = JSON.parse(fs.readFileSync(coverageFile, 'utf8'));
            const lineEmoji = coverage.lineCoverage >= 80 ? '✅' : 
                             coverage.lineCoverage >= 60 ? '⚠️' : '❌';
            
            const comment = `## 📊 Code Coverage Report\n\n` +
              `| Metric | Coverage | Lines/Branches | Status |\n` +
              `|--------|----------|----------------|--------|\n` +
              `| **Line Coverage** | **${coverage.lineCoverage.toFixed(2)}%** | ${coverage.lines.covered} / ${coverage.lines.total} | ${lineEmoji} |\n` +
              `| **Branch Coverage** | **${coverage.branchCoverage.toFixed(2)}%** | ${coverage.branches.covered} / ${coverage.branches.total} | ${lineEmoji} |\n\n` +
              `### Quality Gates\n` +
              `- ${coverage.lineCoverage >= 80 ? '✅' : coverage.lineCoverage >= 70 ? '⚠️' : '❌'} Line Coverage: ${coverage.lineCoverage >= 80 ? 'Excellent' : coverage.lineCoverage >= 70 ? 'Good' : 'Needs Improvement'}\n` +
              `- ${coverage.branchCoverage >= 70 ? '✅' : coverage.branchCoverage >= 60 ? '⚠️' : '❌'} Branch Coverage: ${coverage.branchCoverage >= 70 ? 'Good' : 'Needs Improvement'}\n\n` +
              `[📈 View Detailed Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # ==========================================================================
  # JOB: Mutation Testing
  # ==========================================================================
  # Performs mutation testing to assess test quality
  # 
  # What is Mutation Testing?
  # Mutation testing introduces small changes (mutations) to your code and
  # checks if your tests detect these changes. This validates test effectiveness.
  # 
  # Mutation Operators:
  #   - AOR: Arithmetic Operator Replacement (+, -, *, /)
  #   - ROR: Relational Operator Replacement (<, >, =, <>)
  #   - LCR: Logical Connector Replacement (AND, OR, NOT)
  #   - SDL: Statement Deletion
  #   - RVR: Return Value Replacement (true/false)
  #   - BVR: Boundary Value Replacement (n±1)
  # 
  # Configuration:
  #   - timeout-minutes: Maximum time for mutation testing (default: 60)
  #   - MIN_MUTATION_SCORE: Minimum score threshold (default: 60%)
  # 
  # Only runs on Pull Requests to save CI/CD resources
  # ==========================================================================
  MutationTest:
    needs: [ Initialization, Build, Test ]
    runs-on: [ windows-latest ]
    name: Run Mutation Tests
    if: github.event_name == 'pull_request'
    timeout-minutes: 60  # Customize based on project size
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for baseline comparison

      - name: Download App Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.Build.outputs.AppsArtifactsName }}
          path: .artifacts/apps

      - name: Download Test App Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.Build.outputs.TestAppsArtifactsName }}
          path: .artifacts/testapps

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: .github/mutation-testing/package-lock.json

      - name: Install Mutation Testing Dependencies
        run: npm ci
        working-directory: .github/mutation-testing

      - name: Download Baseline (if exists)
        id: baseline
        continue-on-error: true
        run: |
          # Try to download baseline from previous runs
          gh api repos/${{ github.repository }}/actions/artifacts \
            --jq '.artifacts[] | select(.name=="MutationBaseline") | .archive_download_url' \
            | head -n 1 | xargs -I {} gh api {} > baseline.zip
          
          if [ -f baseline.zip ]; then
            unzip -o baseline.zip -d .baseline/
            echo "baseline_found=true" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run Mutation Tests
        id: mutation
        continue-on-error: true
        run: npm run mutation-test
        working-directory: .github/mutation-testing

      - name: Generate Mutation Report
        if: always()
        run: npm run generate-report
        working-directory: .github/mutation-testing

      - name: Upload Mutation Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MutationTestReport
          path: .buildartifacts/mutation-report/
          if-no-files-found: ignore
          retention-days: 90

      - name: Save as Baseline for Future Runs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: MutationBaseline
          path: .buildartifacts/mutation-report/summary.json
          retention-days: 30

      - name: Comment PR with Mutation Score
        if: always()
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const reportPath = '.buildartifacts/mutation-report/summary.json';
            
            if (!fs.existsSync(reportPath)) {
              core.warning('Mutation report not found');
              return;
            }
            
            const summary = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            const score = summary.mutationScore || 0;
            const rating = score >= 80 ? '🟢 Excellent' : 
                          score >= 60 ? '🟡 Good' : 
                          score >= 40 ? '🟠 Fair' : '🔴 Poor';
            
            // Load baseline if exists
            let baselineText = '';
            const baselinePath = '.baseline/summary.json';
            if (fs.existsSync(baselinePath)) {
              const baseline = JSON.parse(fs.readFileSync(baselinePath, 'utf8'));
              const delta = score - baseline.mutationScore;
              const deltaEmoji = delta > 0 ? '📈' : delta < 0 ? '📉' : '➡️';
              baselineText = `**Change from baseline:** ${deltaEmoji} ${delta > 0 ? '+' : ''}${delta.toFixed(2)}%\n\n`;
            }
            
            const comment = `## 🧬 Mutation Test Results\n\n` +
              `**Mutation Score:** ${score.toFixed(2)}% ${rating}\n\n` +
              baselineText +
              `| Metric | Count | Percentage |\n` +
              `|--------|-------|------------|\n` +
              `| ✅ Killed | ${summary.killed || 0} | ${((summary.killed/(summary.killed+summary.survived+summary.timeout))*100).toFixed(1)}% |\n` +
              `| ❌ Survived | ${summary.survived || 0} | ${((summary.survived/(summary.killed+summary.survived+summary.timeout))*100).toFixed(1)}% |\n` +
              `| ⏱️ Timeout | ${summary.timeout || 0} | ${((summary.timeout/(summary.killed+summary.survived+summary.timeout))*100).toFixed(1)}% |\n` +
              `| 💥 Error | ${summary.error || 0} | - |\n\n` +
              `### What is Mutation Testing?\n` +
              `Mutation testing validates test quality by introducing small code changes (mutations) ` +
              `and checking if your tests detect them. A high mutation score indicates effective tests.\n\n` +
              `**Quality Gates:**\n` +
              `- ${score >= 80 ? '✅' : '⚠️'} Excellent: ≥80%\n` +
              `- ${score >= 60 ? '✅' : score >= 40 ? '⚠️' : '❌'} Good: 60-80%\n` +
              `- ${score < 40 ? '❌' : ''} Needs Improvement: <40%\n\n` +
              `[📋 View Full Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # ==========================================================================
  # JOB: Deploy
  # ==========================================================================
  # Deploys the application to target environment
  # 
  # Only runs on push to main branch (production deployment)
  # 
  # Required Secret:
  #   - StorageContext: Azure storage connection for deployment
  # 
  # Customize:
  #   - environmentName: Target environment (e.g., Production, Staging)
  # ==========================================================================
  Deploy:
    needs: [ Initialization, Build, Test ]
    runs-on: [ windows-latest ]
    name: Deploy to Environment
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read AL-Go Settings
        uses: microsoft/AL-Go-Actions/ReadSettings@v4.0
        with:
          shell: powershell

      - name: Read Deployment Secrets
        uses: microsoft/AL-Go-Actions/ReadSecrets@v4.0
        with:
          shell: powershell
          settingsJson: ${{ env.Settings }}
          secrets: 'StorageContext'

      - name: Download App Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.Build.outputs.AppsArtifactsName }}
          path: .artifacts/apps

      - name: Deploy to Business Central
        uses: microsoft/AL-Go-Actions/Deploy@v4.0
        with:
          shell: powershell
          settingsJson: ${{ env.Settings }}
          secretsJson: ${{ env.RepoSecrets }}
          environmentName: 'Production'  # Customize as needed
          artifacts: '.artifacts/apps'

  # ==========================================================================
  # JOB: Post-Process
  # ==========================================================================
  # Cleanup and finalization
  # 
  # Always runs (even if previous jobs fail) to ensure proper cleanup
  # ==========================================================================
  PostProcess:
    if: always()
    runs-on: [ windows-latest ]
    needs: [ Initialization, Build, Test ]
    name: Finalize Workflow
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Finalize AL-Go Workflow
        id: PostProcess
        uses: microsoft/AL-Go-Actions/WorkflowPostProcess@v4.0
        with:
          shell: powershell
          telemetryScopeJson: ${{ needs.Initialization.outputs.telemetryScopeJson }}

# ============================================================================
# END OF PIPELINE TEMPLATE
# ============================================================================
# 
# CUSTOMIZATION CHECKLIST:
# □ Update project name in Build job (line ~180)
# □ Configure minimum coverage threshold (line ~350)
# □ Configure minimum mutation score (line ~520)
# □ Set deployment environment name (line ~670)
# □ Add required GitHub Secrets
# □ Test pipeline with a Pull Request
# 
