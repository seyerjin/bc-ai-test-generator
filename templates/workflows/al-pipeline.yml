name: CI/CD

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '.vscode/**'
      - '.gitignore'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write

env:
  AL_GO_VERSION: 'latest'

jobs:
  Initialization:
    runs-on: [ windows-latest ]
    outputs:
      telemetryScopeJson: ${{ steps.init.outputs.telemetryScopeJson }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize the workflow
        id: init
        uses: microsoft/AL-Go-Actions/WorkflowInitialize@v4.0
        with:
          shell: powershell

  Build:
    needs: [ Initialization ]
    runs-on: [ windows-latest ]
    name: Build
    outputs:
      AppsArtifactsName: ${{ steps.calculateArtifactNames.outputs.AppsArtifactsName }}
      TestAppsArtifactsName: ${{ steps.calculateArtifactNames.outputs.TestAppsArtifactsName }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read settings
        id: ReadSettings
        uses: microsoft/AL-Go-Actions/ReadSettings@v4.0
        with:
          shell: powershell

      - name: Read secrets
        uses: microsoft/AL-Go-Actions/ReadSecrets@v4.0
        with:
          shell: powershell
          settingsJson: ${{ env.Settings }}
          secrets: 'licenseFileUrl,insiderSasToken,KeyVaultCertificatePfxPassword,KeyVaultCertificatePassword,KeyVaultClientId'

      - name: Calculate Artifact Names
        id: calculateArtifactNames
        run: |
          $project = "main"
          $buildMode = "Default"
          Write-Host "::set-output name=AppsArtifactsName::$project-Apps-$buildMode"
          Write-Host "::set-output name=TestAppsArtifactsName::$project-TestApps-$buildMode"
        shell: powershell

      - name: Run pipeline
        uses: microsoft/AL-Go-Actions/RunPipeline@v4.0
        with:
          shell: powershell
          settingsJson: ${{ env.Settings }}
          secretsJson: ${{ env.RepoSecrets }}

      - name: Publish artifacts - Apps
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.calculateArtifactNames.outputs.AppsArtifactsName }}
          path: |
            .buildartifacts/Apps/*.app
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish artifacts - Test Apps
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.calculateArtifactNames.outputs.TestAppsArtifactsName }}
          path: |
            .buildartifacts/TestApps/*.app
          if-no-files-found: ignore
          retention-days: 30

  Test:
    needs: [ Initialization, Build ]
    runs-on: [ windows-latest ]
    name: Run Tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read settings
        uses: microsoft/AL-Go-Actions/ReadSettings@v4.0
        with:
          shell: powershell

      - name: Read secrets
        uses: microsoft/AL-Go-Actions/ReadSecrets@v4.0
        with:
          shell: powershell
          settingsJson: ${{ env.Settings }}
          secrets: 'licenseFileUrl,insiderSasToken'

      - name: Download App Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.Build.outputs.AppsArtifactsName }}
          path: .artifacts/apps

      - name: Download Test App Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.Build.outputs.TestAppsArtifactsName }}
          path: .artifacts/testapps

      - name: Run Tests
        uses: microsoft/AL-Go-Actions/RunTests@v4.0
        with:
          shell: powershell
          settingsJson: ${{ env.Settings }}
          secretsJson: ${{ env.RepoSecrets }}

      - name: Publish Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TestResults
          path: .buildartifacts/TestResults/*.xml
          if-no-files-found: ignore
          retention-days: 30

  MutationTest:
    needs: [ Initialization, Build, Test ]
    runs-on: [ windows-latest ]
    name: Run Mutation Tests
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download App Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.Build.outputs.AppsArtifactsName }}
          path: .artifacts/apps

      - name: Download Test App Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.Build.outputs.TestAppsArtifactsName }}
          path: .artifacts/testapps

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci
        working-directory: .github/mutation-testing

      - name: Run Mutation Tests
        run: npm run mutation-test
        working-directory: .github/mutation-testing
        env:
          MUTATION_CONFIG: ${{ github.workspace }}/mutation.config.json

      - name: Upload Mutation Test Report
        uses: actions/upload-artifact@4
        if: always()
        with:
          name: MutationTestReport
          path: .buildartifacts/mutation-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Comment PR with Mutation Score
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const reportPath = '.buildartifacts/mutation-report/summary.json';
            
            if (fs.existsSync(reportPath)) {
              const summary = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              const score = summary.mutationScore || 0;
              const rating = score >= 80 ? '🟢 Excellent' : 
                            score >= 60 ? '🟡 Good' : 
                            score >= 40 ? '🟠 Fair' : '🔴 Poor';
              
              const comment = `## Mutation Test Results\n\n` +
                `**Mutation Score:** ${score.toFixed(2)}% ${rating}\n\n` +
                `- Killed: ${summary.killed || 0}\n` +
                `- Survived: ${summary.survived || 0}\n` +
                `- Timeout: ${summary.timeout || 0}\n` +
                `- Error: ${summary.error || 0}\n\n` +
                `[View Full Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  Deploy:
    needs: [ Initialization, Build, Test ]
    runs-on: [ windows-latest ]
    name: Deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read settings
        uses: microsoft/AL-Go-Actions/ReadSettings@v4.0
        with:
          shell: powershell

      - name: Read secrets
        uses: microsoft/AL-Go-Actions/ReadSecrets@v4.0
        with:
          shell: powershell
          settingsJson: ${{ env.Settings }}
          secrets: 'StorageContext'

      - name: Download App Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.Build.outputs.AppsArtifactsName }}
          path: .artifacts/apps

      - name: Deploy
        uses: microsoft/AL-Go-Actions/Deploy@v4.0
        with:
          shell: powershell
          settingsJson: ${{ env.Settings }}
          secretsJson: ${{ env.RepoSecrets }}
          environmentName: 'Production'
          artifacts: '.artifacts/apps'

  PostProcess:
    if: always()
    runs-on: [ windows-latest ]
    needs: [ Initialization, Build, Test ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Finalize the workflow
        id: PostProcess
        uses: microsoft/AL-Go-Actions/WorkflowPostProcess@v4.0
        with:
          shell: powershell
          telemetryScopeJson: ${{ needs.Initialization.outputs.telemetryScopeJson }}
